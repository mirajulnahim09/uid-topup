<!doctype html><html data-t="light"><head><meta charset="utf-8"><style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--v-void:#f4f6fb; --v-ink:#0f1729; --v-volt:#5a8a00; --v-ice:#0284c7;}
    /* ওভারলের আসল চেহারা: থিমের void-রঙ ৮৮% + নরম vignette */
    body{min-height:100vh;display:grid;place-items:center;
      font-family:system-ui,'Noto Sans Bengali',sans-serif;
      background:var(--v-void);
    }
    body::before{content:'';position:fixed;inset:0;pointer-events:none;
      background:radial-gradient(125% 95% at 50% 44%, transparent 0%,
        rgba(0,0,0,.18) 62%, rgba(0,0,0,.34) 100%);}
    :root[data-t='light'] body::before{background:radial-gradient(125% 95% at 50% 44%,
      transparent 0%, rgba(20,28,48,.05) 62%, rgba(20,28,48,.11) 100%);}
    .v-dsp{font-weight:800}
    .flex{display:flex}.flex-col{flex-direction:column}.items-center{align-items:center}
    .gap-3{gap:.75rem}.text-center{text-align:center}.mt-0\.5{margin-top:.125rem}
    .block{display:block}.rounded-full{border-radius:9999px}
    .h-\[3px\]{height:3px}.w-\[132px\]{width:132px}
    .nv-svg * { transform-box: fill-box; }
.nv-still * { animation: none !important; }

/* ── পরিবেশ ── */
.nv-amb { transform-origin: 50% 50%; animation: nv-amb 5.6s ease-in-out infinite; }
@keyframes nv-amb {
  0%, 100% { transform: scale(1);    opacity: .85 }
  50%      { transform: scale(1.06); opacity: 1 }
}
/* HUD বন্ধনী — খুব মৃদু, নাহলে মনোযোগ কেড়ে নেয় */
.nv-hud { animation: nv-hud 4.8s ease-in-out infinite; }
@keyframes nv-hud { 0%, 100% { opacity: .3 } 50% { opacity: .52 } }
/* মঞ্চের ষড়ভুজ জাল — চার্জের সাথে সাড়া দেয় */
.nv-grid { transform-origin: 50% 50%; animation: nv-grid 5.2s ease-out infinite; }
@keyframes nv-grid {
  0%, 40%  { opacity: .18; transform: scale(1) }
  46%      { opacity: .55; transform: scale(1.04) }
  70%      { opacity: .28; transform: scale(1) }
  100%     { opacity: .18; transform: scale(1) }
}

/* ── দেহ: মৃদু ওঠানামা + আঘাতের ঝাঁকুনি + খুশির লাফ ── */
.nv-body { animation: nv-body 5.2s cubic-bezier(.4,0,.35,1) infinite; }
@keyframes nv-body {
  0%, 100% { transform: translateY(0) }
  22%      { transform: translateY(-1px) }
  29%      { transform: translateY(-5px) }   /* আঘাতের ঝাঁকুনি */
  36%      { transform: translateY(0) }
  47%      { transform: translateY(-6px) }   /* ইগনিশনে খুশির লাফ */
  54%      { transform: translateY(0) }
  60%      { transform: translateY(-3px) }
  68%      { transform: translateY(0) }
}

.nv-breathe { transform-origin: 50% 100%; animation: nv-breathe 3.8s ease-in-out infinite; }
@keyframes nv-breathe {
  0%, 100% { transform: scaleY(1) scaleX(1) }
  50%      { transform: scaleY(1.028) scaleX(.994) }
}

.nv-shadow { transform-origin: 50% 50%; animation: nv-shadow 5.2s cubic-bezier(.4,0,.35,1) infinite; }
@keyframes nv-shadow {
  0%, 100% { transform: scaleX(1);   opacity: .34 }
  29%      { transform: scaleX(.9);  opacity: .2 }
  47%      { transform: scaleX(.88); opacity: .18 }
  68%      { transform: scaleX(1);   opacity: .34 }
}

/* ── মাথা: ডায়মন্ড অনুসরণ, তারপর চিহ্নের দিকে তাকানো ── */
.nv-head { transform-origin: 50% 92%; animation: nv-head 5.2s cubic-bezier(.4,0,.3,1) infinite; }
@keyframes nv-head {
  0%, 12%  { transform: rotate(0deg) translateX(0) }
  22%      { transform: rotate(5deg) translateX(3px) }
  29%      { transform: rotate(8deg) translateX(4px) }   /* আঘাতের ঝোঁক */
  40%      { transform: rotate(6deg) translateX(3px) }   /* উড়ন্ত ডায়মন্ড দেখে */
  50%      { transform: rotate(7deg) translateX(4px) }   /* চিহ্নের দিকে */
  70%      { transform: rotate(4deg) translateX(2px) }
  100%     { transform: rotate(0deg) translateX(0) }
}
.nv-pupil { animation: nv-pupil 5.2s cubic-bezier(.4,0,.3,1) infinite; }
@keyframes nv-pupil {
  0%, 10%  { transform: translateX(0) }
  24%      { transform: translateX(2.6px) }
  44%      { transform: translateX(4.2px) }   /* চিহ্নে স্থির */
  68%      { transform: translateX(3.4px) }
  100%     { transform: translateX(0) }
}

/* ── পলক + খুশির চোখ ──
   ⚠️ একই উপাদানে **দুটি** অ্যানিমেশন কমা দিয়ে: আলাদা ক্লাসে ভাগ
   করলে দুটি `animation` ঘোষণা পরস্পরকে বাতিল করত। */
.nv-eyes { transform-origin: 50% 50%; animation: nv-blink 5.4s ease-in-out infinite, nv-eyes-hide 5.2s linear infinite; }
@keyframes nv-blink {
  0%, 40%, 45.5%, 85%, 100% { transform: scaleY(1) }
  42.5%, 43.8%              { transform: scaleY(.06) }
  87.5%, 88.8%              { transform: scaleY(.06) }
}
@keyframes nv-eyes-hide {
  0%, 44%, 70%, 100% { opacity: 1 }
  47%, 66%           { opacity: 0 }
}
.nv-eyes-happy { opacity: 0; animation: nv-happy 5.2s linear infinite; }
@keyframes nv-happy {
  0%, 44%, 70%, 100% { opacity: 0 }
  47%, 66%           { opacity: 1 }
}

/* ── কান ── */
.nv-ear-l { transform-origin: 72% 100%; animation: nv-ear-l 5.9s ease-in-out infinite; }
.nv-ear-r { transform-origin: 28% 100%; animation: nv-ear-r 6.7s ease-in-out infinite; }
@keyframes nv-ear-l {
  0%, 22%, 30%, 100% { transform: rotate(0deg) }
  25%                { transform: rotate(-8deg) }
  27.5%              { transform: rotate(3deg) }
}
@keyframes nv-ear-r {
  0%, 54%, 63%, 100% { transform: rotate(0deg) }
  57%                { transform: rotate(7deg) }
  60%                { transform: rotate(-3deg) }
}

/* ── লেজ ── pivot ডান-নিচে: লেজ দেহ থেকে বাঁয়ে বেরোয় */
.nv-tail { transform-origin: 98% 100%; animation: nv-tail 4.6s ease-in-out infinite; }
@keyframes nv-tail {
  0%, 100% { transform: rotate(5deg) }
  33%      { transform: rotate(-7deg) }
  66%      { transform: rotate(9deg) }
}

/* ── কলার ও ট্যাগ — ট্যাগটি দুলে, ইগনিশনে ঝলকে ── */
.nv-tag { transform-origin: 50% 0%; animation: nv-tag 5.2s ease-in-out infinite; }
@keyframes nv-tag {
  0%, 100% { transform: rotate(-3deg) }
  29%      { transform: rotate(6deg) }    /* আঘাতের ধাক্কা */
  47%      { transform: rotate(-7deg) }
  62%      { transform: rotate(3deg) }
  80%      { transform: rotate(-3deg) }
}

/* ── থাবা: প্রস্তুতি → আঘাত → ফেরা ── */
.nv-paw { transform-origin: 12% 14%; animation: nv-paw 5.2s cubic-bezier(.34,0,.2,1) infinite; }
@keyframes nv-paw {
  0%, 14%  { transform: rotate(0deg) translateX(0) }
  23%      { transform: rotate(-28deg) translateX(-5px) }  /* পিছনে টানা */
  29%      { transform: rotate(7deg) translateX(16px) }    /* আঘাত */
  38%      { transform: rotate(-6deg) translateX(2px) }
  48%      { transform: rotate(-14deg) translateX(4px) }   /* উল্লাসে তোলা */
  62%      { transform: rotate(-10deg) translateX(3px) }
  100%     { transform: rotate(0deg) translateX(0) }
}

/* ══════════ ডায়মন্ড — বিড়াল থেকে চিহ্ন পর্যন্ত ══════════
   বিশ্রামে (২৬৬,১৫০), লক্ষ্য চিহ্নের কেন্দ্র (৩৫২,১১৮) → Δ(+86,−32)।
   ⚠️ ৪৪%-এ ডায়মন্ড **অদৃশ্য** হয় (চিহ্নে শুষে নেওয়া) — তখনই
   ইগনিশন। দুটি একই ফ্রেমে না ঘটলে "লেগেছে" মনে হতো না। */
.nv-dia { animation: nv-dia 5.2s infinite; }
@keyframes nv-dia {
  0%   { transform: translate(-6px,-4px) scale(1); opacity: 1; animation-timing-function: cubic-bezier(.4,0,.5,1) }
  14%  { transform: translate(-14px,4px) scale(1);  opacity: 1; animation-timing-function: cubic-bezier(.3,0,.2,1) }
  23%  { transform: translate(-20px,2px) scale(1);  opacity: 1; animation-timing-function: cubic-bezier(.4,0,.9,1) }
  29%  { transform: translate(-12px,0) scale(1.06); opacity: 1; animation-timing-function: cubic-bezier(.1,.7,.3,1) }
  43%  { transform: translate(84px,-31px) scale(.9); opacity: 1; animation-timing-function: linear }
  44%  { transform: translate(86px,-32px) scale(.5); opacity: 0 }   /* শুষে নেওয়া */
  70%  { transform: translate(86px,-32px) scale(.5); opacity: 0; animation-timing-function: cubic-bezier(.3,1.5,.5,1) }
  84%  { transform: translate(-6px,-4px) scale(1);  opacity: 1 }    /* ফিরে আসা */
  100% { transform: translate(-6px,-4px) scale(1);  opacity: 1 }
}
.nv-dia-bloom { transform-origin: 50% 50%; animation: nv-dia-bloom 5.2s ease-out infinite; }
@keyframes nv-dia-bloom {
  0%, 24% { transform: scale(1);    opacity: .75 }
  30%     { transform: scale(1.55); opacity: 1 }
  44%     { transform: scale(1.1);  opacity: .9 }
  100%    { transform: scale(1);    opacity: .75 }
}
/* গতি-রেখা — কেবল উড়ন্ত অবস্থায় */
.nv-dia-streak { transform-origin: 50% 50%; opacity: 0; animation: nv-dia-streak 5.2s linear infinite; }
@keyframes nv-dia-streak {
  0%, 29%, 46%, 100% { opacity: 0; transform: scaleX(.4) }
  34%                { opacity: .6; transform: scaleX(1.4) }
  42%                { opacity: .3; transform: scaleX(1.1) }
}
.nv-dia-sat { transform-origin: 50% 50%; animation: nv-sat 3.4s linear infinite; }
@keyframes nv-sat { to { transform: rotate(-360deg) } }
/* কণা-রেখা — ডায়মন্ডের পিছনে */
.nv-trail-p { opacity: 0; animation: nv-trail 5.2s ease-out infinite; }
.nv-trail-p--2 { animation-delay: .06s }
.nv-trail-p--3 { animation-delay: .12s }
@keyframes nv-trail {
  0%, 29% { opacity: 0;  transform: translate(0,0) scale(1) }
  33%     { opacity: .95; transform: translate(-16px,6px) scale(.9) }
  44%     { opacity: 0;  transform: translate(-46px,16px) scale(.3) }
  100%    { opacity: 0;  transform: translate(-46px,16px) scale(.3) }
}

/* ── থাবার স্ফুলিঙ্গ — কেবল সংস্পর্শের মুহূর্তে ── */
.nv-spark { transform-origin: 50% 50%; opacity: 0; animation: nv-spark 5.2s ease-out infinite; }
@keyframes nv-spark {
  0%, 27% { opacity: 0; transform: scale(.4) }
  29.5%   { opacity: 1; transform: scale(1) }
  36%     { opacity: 0; transform: scale(1.5) }
  100%    { opacity: 0; transform: scale(1.5) }
}

/* ══════════ ব্র্যান্ড-চিহ্ন: ম্লান → জ্বলন্ত → ম্লান ══════════ */
.nv-mark-dim { animation: nv-mark-dim 5.2s ease-out infinite; }
@keyframes nv-mark-dim {
  0%, 43% { opacity: 1 }
  46%     { opacity: 0 }
  68%     { opacity: 0 }
  78%     { opacity: 1 }
  100%    { opacity: 1 }
}
.nv-mark-lit { opacity: 0; animation: nv-mark-lit 5.2s ease-out infinite; }
@keyframes nv-mark-lit {
  0%, 43% { opacity: 0 }
  45%     { opacity: 1 }
  68%     { opacity: 1 }
  78%     { opacity: 0 }
  100%    { opacity: 0 }
}
/* পুরো চিহ্নটি আঘাতে সামান্য "ধাক্কা" খায় — জড় বস্তু মনে হয় না */
.nv-mark { transform-origin: 50% 50%; animation: nv-mark 5.2s cubic-bezier(.2,.9,.3,1) infinite; }
@keyframes nv-mark {
  0%, 42% { transform: scale(1) }
  45%     { transform: scale(1.12) }
  52%     { transform: scale(.98) }
  60%     { transform: scale(1.02) }
  70%     { transform: scale(1) }
  100%    { transform: scale(1) }
}
.nv-mark-bloom { transform-origin: 50% 50%; opacity: 0; animation: nv-mark-bloom 5.2s ease-out infinite; }
/* ⚠️ চার্জিত পর্বে আভা **ধরে রাখতে হয়**। প্রথমে ৫৬%-এই তা ম্লান
   হয়ে যেত, ফলে বিড়াল যখন খুশিতে হাসছে তখন চিহ্নটি দেখতে নিভে
   যাওয়া মনে হতো — পরিশোধের মুহূর্তটাই দুর্বল হয়ে পড়ত। */
@keyframes nv-mark-bloom {
  0%, 42% { opacity: 0;   transform: scale(.6) }
  45%     { opacity: 1;   transform: scale(1.12) }
  52%     { opacity: .82; transform: scale(.96) }
  68%     { opacity: .72; transform: scale(1) }
  78%     { opacity: 0;   transform: scale(.82) }
  100%    { opacity: 0;   transform: scale(.6) }
}
/* বজ্রটি জ্বলে ওঠার ঠিক পরে একবার ঝিলিক দেয় */
.nv-bolt { animation: nv-bolt 5.2s linear infinite; }
@keyframes nv-bolt {
  0%, 44% { opacity: .95 }
  47%     { opacity: .55 }
  50%     { opacity: 1 }
  56%     { opacity: .8 }
  68%     { opacity: .95 }
  100%    { opacity: .95 }
}
/* শকওয়েভ — দুটি রিং, একটি সামান্য পিছিয়ে */
.nv-shock { transform-origin: 50% 50%; opacity: 0; animation: nv-shock 5.2s cubic-bezier(.15,.7,.3,1) infinite; }
.nv-shock--2 { animation-delay: .09s }
@keyframes nv-shock {
  0%, 43% { opacity: 0;   transform: scale(.9) }
  45%     { opacity: .9;  transform: scale(1.05) }
  58%     { opacity: 0;   transform: scale(1.75) }
  100%    { opacity: 0;   transform: scale(1.75) }
}
/* আঘাতের রশ্মি */
.nv-burst { transform-origin: 50% 50%; opacity: 0; animation: nv-burst 5.2s ease-out infinite; }
@keyframes nv-burst {
  0%, 43% { opacity: 0; transform: scale(.55) }
  45.5%   { opacity: .95; transform: scale(.85) }
  54%     { opacity: 0; transform: scale(1.2) }
  100%    { opacity: 0; transform: scale(1.2) }
}

/* ── ভাসমান কণা ── */
.nv-mote { opacity: 0; animation: nv-mote 7s ease-in-out infinite; }
.nv-mote--2 { animation-delay: 1.4s; animation-duration: 8.2s }
.nv-mote--3 { animation-delay: 2.9s; animation-duration: 6.4s }
.nv-mote--4 { animation-delay: 4.1s; animation-duration: 9s }
.nv-mote--5 { animation-delay: 5.5s; animation-duration: 7.6s }
.nv-mote--6 { animation-delay: 3.4s; animation-duration: 8.8s }
@keyframes nv-mote {
  0%   { opacity: 0;   transform: translateY(6px) }
  25%  { opacity: .55; transform: translateY(0) }
  60%  { opacity: .3;  transform: translateY(-10px) }
  100% { opacity: 0;   transform: translateY(-20px) }
}

/* ═══════════ স্ট্যাটাস বার্তা — CSS দিয়ে ক্রস-ফেড ═══════════
   কোনো JS টাইমার নেই: তিনটি বার্তা স্তূপ করে রাখা, একটিই
   অ্যানিমেশন পালা করে দেখায়। ফলে **সার্ভার-রেন্ডার করা বুট-পর্দাতেও**
   হুবহু একই আচরণ — JS চালু হওয়ার আগেই বার্তা বদলাতে থাকে। */
.nv-msg { display: grid; }
.nv-msg > span { grid-area: 1 / 1; opacity: 0; animation: nv-msg 9s ease-in-out infinite; }
.nv-msg > span:nth-child(2) { animation-delay: 3s }
.nv-msg > span:nth-child(3) { animation-delay: 6s }
/* ⚠️ সময়গুলো **ওভারল্যাপ করতেই হবে**। প্রথম সংস্করণে একটি বার্তা
   ৩৩% এ পুরো মিলিয়ে যেত আর পরেরটি ৩৬% এর আগে ফুটত না — মাঝের
   ~০.৪ সেকেন্ড পর্দায় **কোনো বার্তাই থাকত না**। টেস্টে সেটি ধরা
   পড়েছিল ("০ → ১ দৃশ্যমান")। বিলম্ব ৩s, তাই এখানে বেরিয়ে যাওয়া
   ৩৩% (=৩s) এর **পরে** শেষ হয় — দুটি বার্তা এক পলকের জন্য একসাথে
   থাকে, সেটাই আসল ক্রস-ফেড। */
@keyframes nv-msg {
  0%      { opacity: 0; transform: translateY(5px) }
  4%, 33% { opacity: 1; transform: translateY(0) }
  42%     { opacity: 0; transform: translateY(-5px) }
  100%    { opacity: 0; transform: translateY(-5px) }
}

/* ── অগ্রগতির সরু রেখা (শতাংশ নয় — কেবল "চলছে" ইঙ্গিত) ── */
.nv-bar { overflow: hidden; }
.nv-bar > i { display: block; width: 40%; height: 100%; border-radius: inherit;
  background: linear-gradient(90deg, transparent, var(--v-volt), transparent);
  animation: nv-bar 1.9s cubic-bezier(.5,0,.5,1) infinite; }
@keyframes nv-bar {
  0%   { transform: translateX(-110%) }
  100% { transform: translateX(360%) }
}

/* ═══════════ কম-গতি পছন্দ ═══════════
   গ্লোবাল নিয়ম সব অ্যানিমেশন .01ms করে দেয় — তাতে দৃশ্যটি জমে যেত।
   চাহিদা: "সরল করো, মান একই রাখো"। তাই কেবল **শান্ত** স্তরগুলো
   ফেরানো হয়: শ্বাস, পলক ও বার্তা-বদল। ছোটাছুটি, আঘাত, শকওয়েভ,
   রশ্মি ও কণা সম্পূর্ণ স্থির।

   ⚠️ কিন্তু চিহ্নটি **জ্বলন্ত অবস্থাতেই** থেমে থাকে (`.nv-mark-lit`
   এর opacity ১, `.nv-mark-dim` ০) — নাহলে কম-গতির ব্যবহারকারী একটি
   ম্লান, অসম্পূর্ণ লোগো দেখতেন। গল্পটি বলা যায় না, কিন্তু গল্পের
   **ফলাফল**টি দেখানো যায়: ব্র্যান্ড-চিহ্ন চার্জিত। */
@media (prefers-reduced-motion: reduce) {
  .nv-body, .nv-head, .nv-paw, .nv-tail, .nv-ear-l, .nv-ear-r, .nv-shadow,
  .nv-spark, .nv-trail-p, .nv-dia, .nv-dia-bloom, .nv-dia-streak, .nv-dia-sat,
  .nv-mote, .nv-pupil, .nv-eyes-happy, .nv-amb, .nv-hud, .nv-grid, .nv-tag,
  .nv-mark, .nv-mark-bloom, .nv-mark-dim, .nv-mark-lit, .nv-shock, .nv-burst,
  .nv-bolt, .nv-bar > i {
    animation: none !important;
  }
  /* স্থির অবস্থায় চিহ্নটি জ্বলন্ত, ডায়মন্ড দৃশ্যমান, শকওয়েভ/রশ্মি নেই */
  .nv-mark-lit { opacity: 1 !important; }
  .nv-mark-dim, .nv-shock, .nv-burst, .nv-spark, .nv-trail-p, .nv-dia-streak {
    opacity: 0 !important;
  }
  .nv-mark-bloom { opacity: .45 !important; }
  .nv-dia { opacity: 1 !important; }
  .nv-eyes-happy { opacity: 0 !important; }

  .nv-breathe {
    animation: nv-breathe 7s ease-in-out infinite !important;
    animation-duration: 7s !important;
  }
  .nv-eyes {
    animation: nv-blink 9s ease-in-out infinite !important;
    animation-duration: 9s !important;
    opacity: 1 !important;
  }
  .nv-msg > span {
    animation: nv-msg 9s ease-in-out infinite !important;
    animation-duration: 9s !important;
  }
}

/* ── InlinePulse — কক্ষপথে তিনটি কণা (স্পিনার নয়) ── */
.nv-pulse { position: relative; }
.nv-pulse > i {
  position: absolute; top: 50%; left: 50%;
  width: 22%; height: 22%; margin: -11% 0 0 -11%;
  border-radius: 999px; background: var(--v-volt);
  animation: nv-pulse 1.15s linear infinite;
}
.nv-pulse > i:nth-child(2) { background: var(--v-ice); animation-delay: -.383s }
.nv-pulse > i:nth-child(3) { background: var(--v-volt); animation-delay: -.766s; opacity: .6 }
@keyframes nv-pulse {
  from { transform: rotate(0deg) translateX(150%) }
  to   { transform: rotate(360deg) translateX(150%) }
}
@media (prefers-reduced-motion: reduce) {
  .nv-pulse > i { animation: nv-pulse-rm 1.4s ease-in-out infinite !important; animation-duration: 1.4s !important; }
  .nv-pulse > i:nth-child(2) { animation-delay: .2s !important }
  .nv-pulse > i:nth-child(3) { animation-delay: .4s !important }
  @keyframes nv-pulse-rm { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
}
