# ═══════════════════════════════════════════════════════════
# ★ CI — প্রতিটি push ও PR-এ কোয়ালিটি গেট
#
#   কেন: deploy-এর আগে typecheck / lint / build স্বয়ংক্রিয়ভাবে
#   না চললে ভাঙা কোড production-এ চলে যেতে পারে। এই গেট সেটা ঠেকায়।
#
#   ⚠️ কোনো secret লাগে না — build ধাপে DATABASE_URL/NEXTAUTH_SECRET
#   ডামি মান দেওয়া হয় (env.ts build-phase-এ যাচাই skip করে)।
#   আসল DB কানেকশন CI-তে হয় না; শুধু compile/lint যাচাই।
# ═══════════════════════════════════════════════════════════
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  # ★ দৈনিক — মাইগ্রেশন-গার্ডের জন্য। কেউ push না করলেও ডাটাবেস ও
  #   কোডের মধ্যে ফাঁক তৈরি হতে পারে (হাতে `db push`, রোলব্যাক)।
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

# ★ ন্যূনতম অধিকার — জবগুলো কেবল কোড পড়ে। রিপো-সেটিংয়ে ডিফল্ট
#   টোকেন read-write থাকলেও এখানে কোনো লেখার অধিকার যাবে না
#   (কোনো নির্ভরতা আপোস হলে রিপোতে push/রিলিজ করতে পারবে না)।
permissions:
  contents: read

jobs:
  quality:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # ★ build-phase ডামি — env.ts phase-production-build-এ যাচাই বাদ দেয়
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?sslmode=disable"
      NEXTAUTH_SECRET: "ci-only-secret-at-least-24-characters-long"
      NEXTAUTH_URL: "http://localhost:3000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ═══════════════════════════════════════════════════════════
  # ★ টাকার পথের ইন্টিগ্রেশন টেস্ট (Group D)
  #
  #   ⚠️ নিজস্ব Postgres **সার্ভিস কনটেইনার** — লাইভ Neon কখনো নয়
  #   (CLAUDE.md §2.1)। টেস্ট প্রতিটি টেবিল truncate করে, তাই
  #   `vitest.setup.ts` এর গার্ড localhost ছাড়া চলতেই দেয় না।
  # ═══════════════════════════════════════════════════════════
  test:
    name: Money-path tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: uidtopup_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U test -d uidtopup_test"
          --health-interval 2s --health-timeout 3s --health-retries 30

    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5433/uidtopup_test
      # ★ প্রোডাকশন DATABASE_URL ইচ্ছাকৃতভাবে **দেওয়া হয়নি** —
      #   CI-তে লাইভ ডাটাবেসের কোনো কাজ নেই।
      NEXTAUTH_SECRET: "ci-only-secret-at-least-24-characters-long"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Run money-path tests
        run: npm test

  # ═══════════════════════════════════════════════════════════
  # ★★★ মাইগ্রেশন গার্ড — স্থাপনার DB কোডের সাথে মেলে কি না
  #
  #   ⚠️ কোন বাগটি ঠেকায়: ২০২৬-০৮-১১ তারিখে Group E/F/H এর ৪টি
  #   মাইগ্রেশন টেস্ট DB-তে প্রয়োগ হয়েছিল (১৭১টি টেস্ট সবুজ) কিন্তু
  #   লাইভ Neon-এ নয়। ফলাফল: প্রতিটি প্রোডাক্ট পাতা 500। উপরের
  #   `test` job এটি **কখনোই** ধরতে পারত না — সে নিজের DB-তে স্কিমা
  #   push করে নেয়, তাই সেখানে drift থাকা অসম্ভব।
  #
  #   ⚠️ PR-এ চলে না, ইচ্ছাকৃতভাবে: PR-এর কোড এখনো স্থাপন হয়নি, তাই
  #   "DB কোডের চেয়ে পুরনো" হওয়াটা সেখানে স্বাভাবিক ও প্রত্যাশিত।
  #   প্রশ্নটি mainline-এ ও প্রতিদিন অর্থবহ।
  #
  #   ⚠️ গোপন মান অনুপস্থিত থাকলে job **ব্যর্থ হয়**, skip নয় —
  #   নীরব skip মানেই সেই ধারণা ("নিশ্চয়ই প্রয়োগ হয়েছে") যা প্রথমবার
  #   বাগটি তৈরি করেছিল।
  #
  #   ★ O-15 — ক্রেডেনশিয়াল-সীমা (GitHub নিজে প্রয়োগ করে, YAML নয়):
  #   · কেবল `main` — job-এর `if` ছাড়াও `production-db-readonly`
  #     environment-এর deployment-branch policy = main। অন্য ব্রাঞ্চে
  #     (workflow_dispatch বা push) এই YAML বদলালেও environment-এর
  #     secret মেলে না।
  #   · **read-only** রোল: `PRODUCTION_DATABASE_URL_READONLY` (+ ঐচ্ছিক
  #     `PRODUCTION_DIRECT_URL_READONLY`)। `migrate status` ও `migrate diff`
  #     কেবল পড়ে; এই job কখনো মাইগ্রেট করে না — সেটি কেবল
  #     migrate-production.yml (`production-db`, reviewer-অনুমোদন)।
  #   · secret কেবল শেষ ধাপের `env`-এ — `npm ci` (`--ignore-scripts`)
  #     ও `prisma generate` কোনো ক্রেডেনশিয়াল দেখে না।
  # ═══════════════════════════════════════════════════════════
  migrate-guard:
    name: Deployed DB matches schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: production-db-readonly

    env:
      NEXTAUTH_SECRET: "ci-only-secret-at-least-24-characters-long"

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prisma generate

      - name: Assert every migration is applied and no drift (read-only role)
        env:
          MIGRATE_CHECK_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL_READONLY }}
          # ★ schema-র `directUrl` — Neon-এর non-pooler URL (ঐচ্ছিক; না থাকলে উপরেরটিই)
          MIGRATE_CHECK_DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL_READONLY }}
        run: |
          if [ -z "$MIGRATE_CHECK_DATABASE_URL" ]; then
            echo "::error::PRODUCTION_DATABASE_URL_READONLY is not set in the production-db-readonly environment."
            echo "Without it this guard cannot check the deployed database,"
            echo "and a schema/code mismatch will surface as a 500 in the browser."
            exit 1
          fi
          npx tsx scripts/verify/migrate-status.ts

  # ★ নিরাপত্তা — নির্ভরতার পরিচিত দুর্বলতা স্ক্যান (high+ হলে fail নয়,
  #   শুধু রিপোর্ট — false positive যেন deploy না আটকায়)
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: npm audit (report only)
        run: npm audit --audit-level=high || true
