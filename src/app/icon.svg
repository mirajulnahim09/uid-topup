<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!--
    ★★★ ব্রাউজার-ট্যাব / PWA আইকন — VoltMark v2 এর হুবহু জ্যামিতি

      ⚠️ আগে এখানে সম্পূর্ণ ভিন্ন একটি **হীরা** ছিল (Diamond.tsx
      থেকে নেওয়া), অথচ ন্যাভবার ও ফুটারে ছিল ষড়ভুজ VoltMark।
      অর্থাৎ ট্যাবে এক লোগো, সাইটে আরেক — গ্রাহক দুটোকে এক
      ব্র্যান্ড হিসেবে চিনত না। এখন দুটোই একই চিহ্ন।

      এই ফাইলটি `src/components/fx/VoltMark.tsx` (plate=true) এর
      স্থির অনুলিপি। চিহ্ন বদলালে **দুটোই** একসাথে বদলাতে হবে।

      গাঢ় গোল-চৌকো পটভূমি ইচ্ছাকৃত: হালকা ট্যাব-বারে খালি
      ষড়ভুজের lime প্রান্ত মিলিয়ে যেত।
  -->
  <defs>
    <linearGradient id="vm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8ff3d"/>
      <stop offset=".52" stop-color="#7de3ff"/>
      <stop offset="1" stop-color="#7b2cff"/>
    </linearGradient>
    <mask id="cut">
      <polygon points="24,3 42.19,13.5 42.19,34.5 24,45 5.81,34.5 5.81,13.5" fill="#fff"/>
      <path d="M27.5 11 L16 25.5 H21.8 L20.5 37 L32 22.5 H26.2 Z" fill="#000"/>
    </mask>
  </defs>

  <rect width="48" height="48" rx="11" fill="#0a0b11"/>
  <g transform="translate(24 24) scale(.84) translate(-24 -24)">
    <polygon points="24,3 42.19,13.5 42.19,34.5 24,45 5.81,34.5 5.81,13.5" fill="url(#vm)" mask="url(#cut)"/>
    <polygon points="24,3 42.19,13.5 42.19,34.5 24,45 5.81,34.5 5.81,13.5" fill="none"
      stroke="url(#vm)" stroke-width="1.6" stroke-linejoin="round" opacity=".9"/>
  </g>
</svg>
